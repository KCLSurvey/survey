<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Маржа v9"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Маржа v9</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;background:#f3f5f7;color:#172033;display:grid;place-items:center;min-height:100vh}.load{padding:24px;text-align:center}.spin{width:36px;height:36px;border:4px solid #dbe3ec;border-top-color:#2563eb;border-radius:50%;margin:0 auto 14px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="load"><div class="spin"></div><b>Загрузка калькулятора…</b></div><script>(async()=>{try{const parts=['part-00.b64','part-01.b64','part-02.b64','part-03.b64','part-04.b64'];const texts=await Promise.all(parts.map(p=>fetch(p,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(p);return r.text()})));const b=atob(texts.join('').replace(/\s/g,''));const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);const ds=new DecompressionStream('gzip');const text=await new Response(new Blob([u]).stream().pipeThrough(ds)).text();document.open();document.write(text);document.close();}catch(e){document.body.innerHTML='<div class="load"><b>Не удалось открыть приложение.</b><p>Обновите страницу в Safari.</p></div>';console.error(e);}})();if('serviceWorker'in navigator){navigator.serviceWorker.register('./service-worker.js').catch(console.error)}</script></body></html>
