<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#183153"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Бизнес v10"><link rel="manifest" href="manifest.webmanifest?v=20260714b"><link rel="apple-touch-icon" href="icon.svg?v=20260714b"><link rel="icon" href="icon.svg?v=20260714b" type="image/svg+xml"><title>Бизнес-калькулятор v10</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;background:#f3f5f7;color:#172033;display:grid;place-items:center;min-height:100vh}.load{padding:24px;text-align:center;max-width:360px}.spin{width:36px;height:36px;border:4px solid #dbe3ec;border-top-color:#183153;border-radius:50%;margin:0 auto 14px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}button{border:0;border-radius:12px;padding:12px 16px;background:#183153;color:white;font-weight:700;font-size:16px}</style></head><body><div class="load"><div class="spin"></div><b>Загрузка бизнес-калькулятора…</b></div><script>
const BUILD='20260714b';
function loadPako(){return new Promise((ok,fail)=>{if(window.pako)return ok();const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako_inflate.min.js';s.crossOrigin='anonymous';s.onload=ok;s.onerror=()=>fail(new Error('pako'));document.head.appendChild(s);});}
async function unpack(bytes){if('DecompressionStream'in window){try{const ds=new DecompressionStream('gzip');return await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();}catch(e){console.warn('Native gzip failed',e);}}await loadPako();return new TextDecoder('utf-8').decode(window.pako.ungzip(bytes));}
(async()=>{try{const parts=['part-00.b64','part-01.b64','part-02.b64','part-03.b64','part-04.b64','part-05.b64'];const texts=await Promise.all(parts.map(p=>fetch(p+'?v='+BUILD,{cache:'reload'}).then(r=>{if(!r.ok)throw new Error(p+': '+r.status);return r.text()})));const joined=texts.join('').replace(/\s/g,'');const b=atob(joined);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);const html=await unpack(u);if(!html.includes('<html'))throw new Error('invalid html');document.open();document.write(html);document.close();}catch(e){console.error(e);document.body.innerHTML='<div class="load"><b>Не удалось открыть приложение.</b><p>Нажмите кнопку ниже. Страница загрузится заново без старого кэша.</p><button onclick="location.replace(location.pathname+\'?repair=\'+Date.now())">Обновить приложение</button><p style="font-size:12px;color:#667085">Ошибка: '+String(e.message||e).replace(/[<>]/g,'')+'</p></div>';}})();
if('serviceWorker'in navigator){navigator.serviceWorker.register('./service-worker.js?v='+BUILD,{updateViaCache:'none'}).then(r=>r.update()).catch(console.error)}
</script></body></html>
