name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published applications
        id: verify
        env:
          BASE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="${BASE_URL%/}"
          urls=(
            "$BASE/margin-calculators/"
            "$BASE/margin-calculators/v9/"
            "$BASE/margin-calculators/v10/"
            "$BASE/margin-calculators/v9-1/"
            "$BASE/margin-calculators/v10-1/"
            "$BASE/margin-calculators/ai-proxy/setup.html"
          )
          ready=0
          for attempt in $(seq 1 24); do
            ready=1
            for url in "${urls[@]}"; do
              code=$(curl -L -sS -o /tmp/page.html -w '%{http_code}' "$url" || true)
              if [ "$code" != "200" ]; then ready=0; break; fi
            done
            if [ "$ready" = "1" ]; then break; fi
            sleep 5
          done
          [ "$ready" = "1" ]
          curl -LfsS "$BASE/margin-calculators/" | grep -q 'Калькуляторы цены, прибыли и денег'
          curl -LfsS "$BASE/margin-calculators/v9/" | grep -q 'Маржа v9'
          curl -LfsS "$BASE/margin-calculators/v10/" | grep -q 'Бизнес-калькулятор v10'
          curl -LfsS "$BASE/margin-calculators/v9-1/" | grep -q 'Загрузка v9.1'
          curl -LfsS "$BASE/margin-calculators/v10-1/" | grep -q 'Загрузка v10.1'
          curl -LfsS "$BASE/margin-calculators/ai-proxy/setup.html" | grep -q 'Подключение AI к v9.1 и v10.1'
          for n in 00 01 02 03 04; do curl -LfsS -o /dev/null "$BASE/margin-calculators/v9/part-$n.b64"; done
          for n in 00 01 02 03 04 05; do curl -LfsS -o /dev/null "$BASE/margin-calculators/v10/part-$n.b64"; done
          : > /tmp/v91-patch.js
          for n in 1 2 3; do curl -LfsS "$BASE/margin-calculators/v9-1/patch-$n.txt" >> /tmp/v91-patch.js; done
          curl -LfsS "$BASE/margin-calculators/v10-1/patch.js" -o /tmp/v101-patch.js
          curl -LfsS "$BASE/margin-calculators/ai-proxy/calculator_ai_proxy_v2.js" -o /tmp/calculator-ai-proxy.js
          node --check /tmp/v91-patch.js
          node --check /tmp/v101-patch.js
          node --check /tmp/calculator-ai-proxy.js
          echo '2ace3fa9bb8ac4c2f8b263657dd75243d11519a5c9a2005170b210e51958e878  /tmp/v91-patch.js' | sha256sum -c -
          echo 'cc893df3b61eb7f81789bb091c0ceb0414ddee2bf0c866a25cca3125602ead7e  /tmp/v101-patch.js' | sha256sum -c -
          grep -q 'v91-scroll-top' /tmp/v91-patch.js
          grep -q 'v91-shares' /tmp/v91-patch.js
          grep -q 'Резерв, остающийся в бизнесе' /tmp/v91-patch.js
          grep -q 'v101Conclusion' /tmp/v101-patch.js
          cat > margin-calculators/deployment-status.json <<JSON
          {
            "status": "verified",
            "verified_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${GITHUB_SHA}",
            "launcher": "$BASE/margin-calculators/",
            "v9": "$BASE/margin-calculators/v9/",
            "v10": "$BASE/margin-calculators/v10/",
            "v9_1": "$BASE/margin-calculators/v9-1/",
            "v10_1": "$BASE/margin-calculators/v10-1/",
            "ai_setup": "$BASE/margin-calculators/ai-proxy/setup.html"
          }
          JSON
      - name: Record verified deployment
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add margin-calculators/deployment-status.json
          git commit -m 'Record verified calculator deployment [skip ci]'
          git push
