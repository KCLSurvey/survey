name: Extract calculator sources
on:
  push:
    paths:
      - 'tools/extract_calculator_sources.js'
      - '.github/workflows/extract-calculator-sources.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tools/extract_calculator_sources.js
      - name: Commit extracted sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add margin-calculators/_debug/v9-source.html margin-calculators/_debug/v10-source.html
          git diff --cached --quiet || git commit -m 'Extract calculator sources for formula audit'
          git push
