name: Extract calculator sources
on:
  push:
    paths:
      - 'tools/extract_calculator_sources.js'
      - '.github/workflows/extract-calculator-sources.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Correct audit harness terminology
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='tools/extract_calculator_sources.js';
          let s=fs.readFileSync(p,'utf8');
          s=s.replace("function v9Expense(overrides={}){return Object.assign({en:true,name:'Test',applies:'all',mode:'period'","function v9Expense(overrides={}){return Object.assign({en:true,name:'Test',applies:'all',mode:'annual'");
          s=s.replace("const d=r.expenseDetails.find(z=>z.id==='sales_team');approx(d.pnl,x[0],0.02,vatTreatment+' pnl');approx(d.cash,x[1],0.02,vatTreatment+' cash');approx(d.recoverableVat,x[2],0.02,vatTreatment+' vat')","const ds=r.expenseDetails.filter(z=>z.id==='sales_team');approx(ds.reduce((a,z)=>a+z.pnl,0),x[0],0.02,vatTreatment+' pnl');approx(ds.reduce((a,z)=>a+z.cash,0),x[1],0.02,vatTreatment+' cash');approx(ds.reduce((a,z)=>a+z.recoverableVat,0),x[2],0.02,vatTreatment+' vat')");
          fs.writeFileSync(p,s);
          NODE
      - name: Run formula audit
        id: audit
        continue-on-error: true
        run: node tools/extract_calculator_sources.js
      - name: Commit audit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add margin-calculators/_debug/formula-audit-report.json
          git diff --cached --quiet || git commit -m 'Record calculator formula audit results'
          git push
      - name: Commit rebuilt calculators after successful audit
        if: steps.audit.outcome == 'success'
        run: |
          git add tools/extract_calculator_sources.js
          git add margin-calculators/_debug/v9-source.html margin-calculators/_debug/v10-source.html
          git add margin-calculators/v10/index.html margin-calculators/v10/service-worker.js margin-calculators/v10/part-*.b64
          git diff --cached --quiet || git commit -m 'Publish calculators after comprehensive formula audit'
          git push
      - name: Fail workflow when audit failed
        if: steps.audit.outcome != 'success'
        run: exit 1
