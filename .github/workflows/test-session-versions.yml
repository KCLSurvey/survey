name: Test calculator session versions
on:
  push:
    paths:
      - 'margin-calculators/session-store-core.js'
      - 'margin-calculators/v9-2/**'
      - 'margin-calculators/v10-2/**'
      - 'tools/test-session-versions.js'
      - '.github/workflows/test-session-versions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tools/test-session-versions.js